{% extends "base.html" %}
{% load static %}

{% block title %}Sign In — CineVerse{% endblock %}

{% block extra_css %}
<style>
    .auth-page {
        min-height: calc(100vh - 72px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        position: relative;
    }
    .auth-page::before {
        content: '';
        position: absolute;
        top: -100px; right: -100px;
        width: 500px; height: 500px;
        background: radial-gradient(circle, var(--accent-glow), transparent 70%);
        opacity: 0.1;
        pointer-events: none;
    }
    .auth-card {
        width: 100%;
        max-width: 440px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        padding: 48px 40px;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.6s ease;
    }
    .auth-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--accent), var(--gold), var(--accent));
    }
    .auth-header {
        text-align: center;
        margin-bottom: 36px;
    }
    .auth-icon {
        width: 60px; height: 60px;
        border-radius: 16px;
        background: rgba(229,9,20,0.1);
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 20px;
        font-size: 1.5rem;
        color: var(--accent);
    }
    .auth-header h1 {
        font-family: var(--font-display);
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 6px;
    }
    .auth-header p {
        color: var(--text-muted);
        font-size: 0.9rem;
    }
    .form-group {
        margin-bottom: 22px;
    }
    .form-label {
        display: block;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 8px;
    }
    .form-input-wrap {
        position: relative;
    }
    .form-input-wrap i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 0.85rem;
        transition: var(--transition);
    }
    .form-input {
        width: 100%;
        padding: 13px 16px 13px 44px;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-family: var(--font-body);
        font-size: 0.9rem;
        transition: var(--transition);
        outline: none;
    }
    .form-input::placeholder { color: var(--text-muted); }
    .form-input:focus {
        border-color: var(--accent);
        background: rgba(229,9,20,0.03);
    }
    .form-input:focus + i,
    .form-input:focus ~ i {
        color: var(--accent);
    }
    .form-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
    }
    .form-row a {
        color: var(--accent);
        font-size: 0.82rem;
        text-decoration: none;
        font-weight: 500;
    }
    .form-row a:hover { text-decoration: underline; }
    .auth-submit {
        width: 100%;
        padding: 14px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: var(--radius-md);
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        transition: var(--transition);
        box-shadow: 0 4px 20px var(--accent-glow);
    }
    .auth-submit:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
        box-shadow: 0 8px 30px var(--accent-glow);
    }
    .auth-divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 28px 0;
    }
    .auth-divider::before, .auth-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
    }
    .auth-divider span {
        font-size: 0.78rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }
    .auth-social {
        display: flex;
        gap: 12px;
    }
    .social-btn {
        flex: 1;
        padding: 12px;
        border-radius: var(--radius-md);
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        font-size: 1.1rem;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .social-btn:hover {
        border-color: var(--border-hover);
        background: var(--bg-elevated);
        color: var(--text-primary);
    }
    .auth-footer {
        text-align: center;
        margin-top: 28px;
        font-size: 0.85rem;
        color: var(--text-muted);
    }
    .auth-footer a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon"><i class="fas fa-user"></i></div>
            <h1>Welcome Back</h1>
            <p>Sign in to continue to CineVerse</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <div class="form-input-wrap">
                    <input type="text" name="username" class="form-input" placeholder="Enter your username" required>
                    <i class="fas fa-user"></i>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="form-input-wrap">
                    <input type="password" name="password" class="form-input" placeholder="Enter your password" required>
                    <i class="fas fa-lock"></i>
                </div>
            </div>
            <div class="form-row">
                <span></span>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="auth-submit">Sign In</button>
        </form>

        <div class="auth-divider"><span>or</span></div>
        <div class="auth-social">
            <button class="social-btn"><i class="fab fa-google"></i></button>
            <button class="social-btn"><i class="fab fa-facebook-f"></i></button>
            <button class="social-btn"><i class="fab fa-twitter"></i></button>
        </div>
        <div class="auth-footer">
            Don't have an account? <a href="{% url 'signup' %}">Sign Up</a>
        </div>
    </div>
</div>
{% endblock %}
