{% extends "base.html" %}
{% load static %}

{% block title %}Sign Up — CineVerse{% endblock %}

{% block extra_css %}
<style>
    .auth-page {
        min-height: calc(100vh - 72px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        position: relative;
    }
    .auth-page::before {
        content: '';
        position: absolute;
        bottom: -100px; left: -100px;
        width: 500px; height: 500px;
        background: radial-gradient(circle, rgba(212,168,83,0.15), transparent 70%);
        opacity: 0.3;
        pointer-events: none;
    }
    .auth-card {
        width: 100%;
        max-width: 480px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        padding: 48px 40px;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.6s ease;
    }
    .auth-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--gold), var(--accent), var(--gold));
    }
    .auth-header {
        text-align: center;
        margin-bottom: 36px;
    }
    .auth-icon {
        width: 60px; height: 60px;
        border-radius: 16px;
        background: var(--gold-soft);
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 20px;
        font-size: 1.5rem;
        color: var(--gold);
    }
    .auth-header h1 {
        font-family: var(--font-display);
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 6px;
    }
    .auth-header p {
        color: var(--text-muted);
        font-size: 0.9rem;
    }
    .form-group { margin-bottom: 20px; }
    .form-label {
        display: block;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 8px;
    }
    .form-input-wrap { position: relative; }
    .form-input-wrap i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 0.85rem;
    }
    .form-input {
        width: 100%;
        padding: 13px 16px 13px 44px;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-family: var(--font-body);
        font-size: 0.9rem;
        transition: var(--transition);
        outline: none;
    }
    .form-input::placeholder { color: var(--text-muted); }
    .form-input:focus {
        border-color: var(--gold);
        background: rgba(212,168,83,0.03);
    }
    .form-checkbox {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 24px 0 28px;
    }
    .form-checkbox input[type="checkbox"] {
        width: 18px; height: 18px;
        margin-top: 2px;
        accent-color: var(--accent);
        cursor: pointer;
    }
    .form-checkbox label {
        font-size: 0.82rem;
        color: var(--text-secondary);
        line-height: 1.5;
        cursor: pointer;
    }
    .form-checkbox a {
        color: var(--accent);
        text-decoration: none;
    }
    .form-checkbox a:hover { text-decoration: underline; }
    .auth-submit {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, var(--gold), #c49235);
        color: #0a0a0f;
        border: none;
        border-radius: var(--radius-md);
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        transition: var(--transition);
        box-shadow: 0 4px 20px rgba(212,168,83,0.3);
    }
    .auth-submit:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 30px rgba(212,168,83,0.4);
    }
    .auth-footer {
        text-align: center;
        margin-top: 28px;
        font-size: 0.85rem;
        color: var(--text-muted);
    }
    .auth-footer a {
        color: var(--gold);
        text-decoration: none;
        font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }

    .strength-bar {
        height: 3px;
        border-radius: 2px;
        background: var(--bg-elevated);
        margin-top: 8px;
        overflow: hidden;
    }
    .strength-bar-fill {
        height: 100%;
        border-radius: 2px;
        width: 0;
        transition: 0.3s ease;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon"><i class="fas fa-popcorn fa-film"></i></div>
            <h1>Join CineVerse</h1>
            <p>Create your account and start booking movies</p>
        </div>

        <form action="signup" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <div class="form-input-wrap">
                    <input type="text" name="username" class="form-input" placeholder="Choose a username" required>
                    <i class="fas fa-user"></i>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div class="form-input-wrap">
                    <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
                    <i class="fas fa-envelope"></i>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="form-input-wrap">
                    <input type="password" name="password" id="pw" class="form-input" placeholder="Create a password" required oninput="checkStrength(this.value)">
                    <i class="fas fa-lock"></i>
                </div>
                <div class="strength-bar"><div class="strength-bar-fill" id="pwBar"></div></div>
            </div>
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <div class="form-input-wrap">
                    <input type="password" name="confirm_password" class="form-input" placeholder="Confirm your password" required>
                    <i class="fas fa-shield-alt"></i>
                </div>
            </div>
            <div class="form-checkbox">
                <input type="checkbox" id="terms" required>
                <label for="terms">I accept the <a href="#">Terms of Use</a> & <a href="#">Privacy Policy</a></label>
            </div>
            <button type="submit" class="auth-submit">Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{% url 'login' %}">Sign In</a>
        </div>
    </div>
</div>
<script>
function checkStrength(pw) {
    const bar = document.getElementById('pwBar');
    let s = 0;
    if(pw.length >= 6) s++;
    if(pw.length >= 10) s++;
    if(/[A-Z]/.test(pw)) s++;
    if(/[0-9]/.test(pw)) s++;
    if(/[^A-Za-z0-9]/.test(pw)) s++;
    const pct = (s/5)*100;
    bar.style.width = pct + '%';
    const colors = ['#e50914','#e50914','#f59e0b','#22c55e','#22c55e'];
    bar.style.background = colors[Math.min(s,4)];
}
</script>
{% endblock %}
